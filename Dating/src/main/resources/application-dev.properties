# ============================================================
# Development Profile - application-dev.properties
# Activate b?ng cách set Active profiles = dev
# ============================================================

# Database - l?y t? .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT - l?y t? .env
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# Cloudinary - t?m th?i dùng placeholder, sau thay b?ng giá tr? th?t
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER}

# Hi?n th? SQL khi dev (d? debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always