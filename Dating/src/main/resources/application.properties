spring.application.name=Dating

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/datingdb
spring.datasource.username=postgres
spring.datasource.password=27122004

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api_key=${CLOUDINARY_API_KEY:demo}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo}
cloudinary.folder=${CLOUDINARY_FOLDER:demo}

# Message unsend policy (minute), = 0 unlimit
message.unsend.window-minutes=1440