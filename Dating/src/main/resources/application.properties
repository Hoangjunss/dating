spring.application.name=Dating

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/datingdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12122004

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api_key=${CLOUDINARY_API_KEY:demo}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:demo}
cloudinary.folder=${CLOUDINARY_FOLDER:demo}

# Message unsend policy (minute), = 0 unlimit
message.unsend.window-minutes=1440