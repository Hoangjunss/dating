spring.application.name=Dating

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/datingdb?useSSL=true&requireSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# T?t show-sql trên production ? b?t ch? khi debug
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging SQL ch? b?t qua profile dev, không log ? production
# Uncomment khi c?n debug:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
# Cloudinary ? dùng environment variables
# ============================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:dating-app}

# ============================================================
# JWT Security
# ============================================================
# ? QUAN TR?NG: jwt.secret ph?i là chu?i ? 32 ký t? ng?u nhiên
# T?o b?ng: openssl rand -base64 64
# L?u vào env var JWT_SECRET, KHÔNG commit vào git
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Message policy
message.unsend.window-minutes=1440

# Multipart / File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Actuator ? ch? expose health endpoint (không l? sensitive info)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
